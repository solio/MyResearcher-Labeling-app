services:
  labeler:
    # 服务端构建：基础镜像（python:3.12-slim）取自私有仓库并常驻缓存，
    # 应用层每次 up -d --build 本地重建；改代码后不推镜像、不产生额外仓库流量
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"   # 只绑本机回环，交给已有 nginx 反代
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 让容器内可连宿主机上的 MySQL（config.json 里 host 填它）
    volumes:
      - ./config.json:/app/config.json:ro   # mysql.host 指向已有实例：宿主机→host.docker.internal；容器/别的主机→内网 IP
      - ./data:/app/data                    # jsonl 审计流水落宿主机
