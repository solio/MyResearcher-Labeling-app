services:
  labeler:
    # 预构建 amd64 镜像（本机 buildx 构建+推送私有仓库；服务器只 pull，不 build、不依赖 Docker Hub）
    # 更新镜像：docker buildx build --platform linux/amd64 -t fangzuzu-docker-registry.cn-guangzhou.cr.aliyuncs.com/fangzuzu/labeler:v1 . && docker push <同串>
    image: fangzuzu-docker-registry-vpc.cn-guangzhou.cr.aliyuncs.com/fangzuzu/labeler:v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"   # 只绑本机回环，交给已有 nginx 反代
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 让容器内可连宿主机上的 MySQL（config.json 里 host 填它）
    volumes:
      - ./config.json:/app/config.json:ro   # mysql.host 指向已有实例：宿主机→host.docker.internal；容器/别的主机→内网 IP
      - ./data:/app/data                    # jsonl 审计流水落宿主机
